name: plugless
description: "PlugLess - A Discord-style chat app"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.2.7

  # Network
  dio: ^5.7.0
  stomp_dart_client: ^2.1.3

  # Local storage
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.3

  # Environment
  flutter_dotenv: ^5.2.1

  # Image
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1

  # Fonts
  google_fonts: ^6.2.1

  # Icons
  cupertino_icons: ^1.0.8

  # Pagination
  infinite_scroll_pagination: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^2.6.1
  custom_lint: ^0.7.5
  riverpod_lint: ^2.6.1

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/

